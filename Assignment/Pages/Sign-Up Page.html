<body>
      <header class="site-header">

<main>

    <!-- identity to section given for css -->
  <div class="signup-layout">

      <section class="signup-card">


        <form id="signupForm">

            <h2>Sign-up below:</h2>
            <label for="fname">Full name:</label><br>
            <input type="text" id="fname" name="fname">
            <span id="fnameError"></span>

            <label for="snum">Student Number:</label><br>
            <input type="text" id="snum" name="snum">
            <span id="snumError"></span>

            <label for="campus">Campus or DL:</label><br>
            <!-- Select dropdown for campus or distance learning -->
            <select id="campus">
                <option value="">Select an option:</option>
                <option value="Campus">Campus</option>
                <option value="Distance Learning">Distance Learning</option>
            </select>

            <!-- Select dropdown for campus name -->
           <select id="campusName" hidden>
                <option value="">Select your campus:</option>
                <option value="Bryanston Campus">Bryanston Campus</option>
                <option value="Cape Town Campus">Cape Town Campus</option>
                <option value="Centurion Campus">Centurion Campus</option>
                <option value="Musgrave Campus">Musgrave Campus</option>
                <option value="Newtown Junction Campus">Newtown Junction Campus</option>
                <option value="Polokwane New Premium Campus">Polokwane New Premium Campus</option>
                <option value="Pretoria Campus">Pretoria Campus</option>
                <option value="Umhlanga Campus">Umhlanga Campus</option>
            </select>


            <span id="campusError"></span>


            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email">
            <span id="emailError"></span>


            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password">
            <span id="passwordError"></span>


            <label for="confirm-password">Confirm Password:</label><br>
            <input type="password" id="confirm-password" name="confirm-password">
            <span id="confirmPasswordError"></span>


            <label for="interests">Interests:</label><br>
            <input type="text" id="interests" name="interests">
            <span id="interestsError"></span>


            <label for="bio">Bio:</label><br>
            <textarea id="bio" name="bio"></textarea>
            <span id="bioError"></span>


            <button type="submit">Sign Up</button><br>



            </form>

      </section>
        <section id="profilePreview">
            <h2>Live Profile Preview</h2>

                <p><strong>Name:</strong> <span id="previewName"></span></p>
                <p><strong>Bio:</strong> <span id="previewBio"></span></p>
                <p><strong>Interests:</strong></p>

            <ul id="previewInterests"></ul>
</section>
  </div>
</main>
